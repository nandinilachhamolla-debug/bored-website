<!DOCTYPE html>
<html>
<head>
    <title>No More Boredom</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: linear-gradient(to right, #74ebd5, #acb6e5);
            margin-top: 50px;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            font-size: 16px;
            border: none;
            border-radius: 20px;
            background-color: #ff6b6b;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff3b3b;
        }

        #task {
            font-size: 20px;
            margin-top: 20px;
            font-weight: bold;
        }

        #timer {
            font-size: 18px;
            margin-top: 10px;
        }

        textarea {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            border: none;
        }
    </style>
</head>

<body>

    <h1>Feeling Bored? 😩</h1>
    <p>Choose an activity and make your time useful!</p>

    <!-- CATEGORY BUTTONS -->
    <button onclick="startTask('english')">English</button>
    <button onclick="startTask('brain')">Brain</button>
    <button onclick="startTask('fun')">Fun</button>

    <!-- OUTPUT -->
    <p id="task"></p>
    <p id="timer"></p>

    <!-- WRITING BOX -->
     
    <div id="writingBox"></div>

    <!-- STREAK -->
    <p>Streak: <span id="streak">0</span></p>

    <!-- MOTIVATION -->
    <p id="motivation"></p>

<script>
let streak = 0;

function startTask(type) {

    let tasks = {
        english: [
            "Speak about your best friend 🎤",
            "Write 5 lines about your day ✍️"
        ],
        brain: [
            "What is 5 + 7? 🧠",
            "Find next number: 2,4,6,?"
        ],
        fun: [
            "Smile for 30 seconds 😄",
            "Draw something ✏️"
        ]
    };

    let random = Math.floor(Math.random() * tasks[type].length);
    let selectedTask = tasks[type][random];

    document.getElementById("task").innerHTML = selectedTask;

    // Start Timer
    startTimer();

    // Show writing box if needed
    if(selectedTask.includes("Write")) {
        document.getElementById("writingBox").innerHTML =
        `<textarea rows="4" cols="30" placeholder="Write here..."></textarea>
         <br><button onclick="completeTask()">Done</button>`;
    } else {
        document.getElementById("writingBox").innerHTML =
        `<br><button onclick="completeTask()">Done</button>`;
    }
}

// TIMER
function startTimer() {
    let time = 30;
    let timer = setInterval(function() {
        document.getElementById("timer").innerHTML = "Time left: " + time + " sec";
        time--;

        if (time < 0) {
            clearInterval(timer);
            document.getElementById("timer").innerHTML = "Time's up! ⏰";
        }
    }, 1000);
}

// COMPLETE TASK
function completeTask() {
    streak++;
    document.getElementById("streak").innerHTML = streak;

    let messages = [
        "Great job! 🌟",
        "Keep going! 💪",
        "You are improving! 🚀"
    ];

    let random = Math.floor(Math.random() * messages.length);
    document.getElementById("motivation").innerHTML = messages[random];
}
</script>

</body>
</html>
