<!DOCTYPE html>
<html>
<head>
    <title>No More Boredom</title>
</head>
<style>
    body {
        text-align: center;
        font-family: Arial;
        background-color: #f0f8ff;
    }

    button {
        padding: 10px 20px;
        font-size: 18px;
        background-color: blue;
        color: white;
        border: none;
        border-radius: 10px;
    }
</style>
<body>

    <h1>Feeling Bored? 😩</h1>
    <p>Click the button to make your time useful!</p>

    <button onclick="showTask()">I’m Bored</button>

    <p id="task"></p>
    <script>
    function showTask() {
        let tasks = [
            "Speak about your mother for 1 minute 🎤",
            "Learn 3 new English words 📘",
            "Write 5 lines about your day ✍️",
            "Solve a simple math problem 🧠",
            "Read one page of a book 📖"
        ];

        let random = Math.floor(Math.random() * tasks.length);
        document.getElementById("task").innerHTML = tasks[random];
    }
    </script>

</body>
</html>
<p id="task"></p>
<p id="timer"></p>

<button onclick="startTask()">I’m Bored</button>

<script>
function startTask() {
    document.getElementById("task").innerHTML = "Speak for 1 minute 🎤";

    let time = 60;
    let timer = setInterval(function() {
        document.getElementById("timer").innerHTML = "Time left: " + time + " sec";
        time--;

        if (time < 0) {
            clearInterval(timer);
            document.getElementById("timer").innerHTML = "Time's up! ⏰";
        }
    }, 1000);
}
</script>
<textarea placeholder="Write here..." rows="4" cols="30"></textarea>
<br>
<button onclick="submitText()">Submit</button>

<p id="result"></p>

<script>
function submitText() {
    document.getElementById("result").innerHTML = "Good job! Keep practicing 👍";
}
</script>
<p>What is 2 + 2?</p>
<input type="text" id="answer">
<button onclick="checkAnswer()">Submit</button>

<p id="quizResult"></p>

<script>
function checkAnswer() {
    let ans = document.getElementById("answer").value;
    if(ans == "4") {
        document.getElementById("quizResult").innerHTML = "Correct! 🎉";
    } else {
        document.getElementById("quizResult").innerHTML = "Try again!";
    }
}
</script>
