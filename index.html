<!DOCTYPE html>
<html>
<head>
<title>No More Boredom</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #f0f8ff;
}

button {
    padding: 10px 20px;
    margin: 8px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: blue;
    color: white;
}

textarea {
    width: 80%;
    height: 80px;
    margin-top: 10px;
}

.day {
    display: inline-block;
    padding: 6px;
    margin: 3px;
    background: lightgray;
    border-radius: 5px;
}

.active {
    background: green;
    color: white;
}
</style>
</head>

<body>

<h1>Feeling Bored? 😩</h1>

<button onclick="startTask()">Start Activity</button>

<p id="task"></p>
<p id="timer"></p>

<!-- Writing Box -->
<div id="writingBox"></div>

<button onclick="startVoice()">🎤 Speak</button>
<br>
<button id="doneBtn" onclick="completeTask()" disabled>Done</button>

<h3>🔥 Weekly Streak</h3>
<div id="week"></div>

<script>

let canComplete = false;

// 10 TASKS (mix of speaking + writing)
let tasks = [
{type:"speak", text:"Speak about your goal 🎤"},
{type:"speak", text:"Speak about your best friend 🎤"},
{type:"speak", text:"Explain your favorite movie 🎬"},
{type:"speak", text:"Describe your daily routine 📅"},
{type:"speak", text:"Talk about your dream job 💼"},

{type:"write", text:"Write 5 lines about your day ✍️"},
{type:"write", text:"Write about your favorite teacher ✍️"},
{type:"write", text:"Write about your hometown ✍️"},
{type:"write", text:"Write about your role model ✍️"},
{type:"write", text:"Write about your favorite subject ✍️"}
];

// START TASK
function startTask() {
    let random = Math.floor(Math.random() * tasks.length);
    let task = tasks[random];

    document.getElementById("task").innerHTML = task.text;

    // Show writing box only for writing tasks
    if(task.type === "write") {
        document.getElementById("writingBox").innerHTML =
        `<textarea id="textInput" placeholder="Write here..."></textarea>`;
    } else {
        document.getElementById("writingBox").innerHTML = "";
    }

    startTimer();
}

// TIMER (60 seconds)
function startTimer() {
    let time = 60;
    canComplete = false;
    document.getElementById("doneBtn").disabled = true;

    let t = setInterval(() => {
        document.getElementById("timer").innerHTML = "Time: " + time + " sec";
        time--;

        if(time < 0) {
            clearInterval(t);
            document.getElementById("timer").innerHTML = "Now you can click Done ✅";
            canComplete = true;
            document.getElementById("doneBtn").disabled = false;
        }
    }, 1000);
}

// VOICE FEATURE
function startVoice() {
    if (!('webkitSpeechRecognition' in window)) {
        alert("Voice not supported");
        return;
    }

    let recognition = new webkitSpeechRecognition();
    recognition.start();

    recognition.onstart = () => {
        document.getElementById("task").innerHTML = "Listening... 🎤";
    };

    recognition.onresult = () => {
        canComplete = true;
        document.getElementById("doneBtn").disabled = false;
        document.getElementById("task").innerHTML = "Good speaking! ✅";
    };
}

// COMPLETE TASK
function completeTask() {
    if(!canComplete) {
        alert("Do the activity first!");
        return;
    }

    let today = new Date().getDay();

    let data = JSON.parse(localStorage.getItem("week")) || [0,0,0,0,0,0,0];
    data[today] = 1;

    localStorage.setItem("week", JSON.stringify(data));
    renderWeek();
}

// WEEK DISPLAY
function renderWeek() {
    let days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    let data = JSON.parse(localStorage.getItem("week")) || [0,0,0,0,0,0,0];

    let html = "";
    for(let i=0;i<7;i++){
        html += `<span class="day ${data[i] ? 'active' : ''}">${days[i]}</span>`;
    }

    document.getElementById("week").innerHTML = html;
}

renderWeek();

</script>

</body>
</html>
